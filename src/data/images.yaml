# Curated catalog of cloud images published by open-img-cloud.
#
# Each entry is enriched at build time by fetching the corresponding
# MANIFEST.json from `IMAGES_BASE_URL` (default: https://images.openimages.cloud).
# When `variants` is set, one MANIFEST-<variant>.json is fetched per variant.
#
# Path scheme on the bucket:
#   <os_name>/<version>/<filename>
#   <os_name>/<version>/MANIFEST.json            (no variant)
#   <os_name>/<version>/MANIFEST-<variant>.json  (with variant)
#
# Optional presentation fields:
#   status       stable (default) | archive | preview  (IMAGE_STANDARDS.md §I)
#   status_note  one-line banner on the image page (EOL date, known issue…)
#   login_user   default cloud-init user, shown in the quick start
#   featured     true → shown on the home page
#   variants[].hint  short explanation of the variant

images:
  - os_name: alpine-linux
    title: Alpine Linux
    tagline: Minimal, security-oriented distro built around musl libc and BusyBox.
    description: |
      Cloud-init-ready, signed Alpine Linux images derived from the upstream
      `generic_alpine` cloud release. Two firmware variants (legacy BIOS and
      UEFI) cover both classic OpenStack and modern Proxmox deployments.
    repo: open-img-cloud/alpine-linux
    upstream_homepage: https://www.alpinelinux.org/
    latest_version: "3.24.1"
    format: qcow2
    arch: x86_64
    tags: [openstack, proxmox, cloud-init, signed]
    logo: alpine-linux.svg
    login_user: alpine
    featured: true
    variants:
      - id: bios
        label: BIOS
        hint: Legacy boot, works on any hypervisor
        filename_template: "alpine-{version}-bios-x86_64.qcow2"
      - id: uefi
        label: UEFI
        hint: Needs hw_firmware_type=uefi on OpenStack, OVMF on Proxmox
        filename_template: "alpine-{version}-uefi-x86_64.qcow2"

  - os_name: amazon-linux-2
    title: Amazon Linux 2
    tagline: AWS's long-term-support base image, derived from the RHEL/CentOS 7 family.
    description: |
      Cloud-init-ready, signed Amazon Linux 2 qcow2 image based on AWS's
      official KVM cloud release. Kept available for workloads that still
      depend on it; new deployments should target Amazon Linux 2023.
    repo: open-img-cloud/amazon-linux-2
    upstream_homepage: https://aws.amazon.com/amazon-linux-2/
    latest_version: "2.0.20261102.0"
    format: qcow2
    arch: x86_64
    tags: [openstack, proxmox, cloud-init, signed]
    logo: amazon.svg
    login_user: ec2-user
    status: archive
    status_note: Amazon Linux 2 reached end of life on 2025-06-30. Builds continue for existing workloads; use Amazon Linux 2023 for new deployments.

  - os_name: amazon-linux-2023
    title: Amazon Linux 2023
    tagline: Fedora-derived AL2023 image — modern dnf-based AWS workhorse.
    description: |
      Cloud-init-ready, signed Amazon Linux 2023 qcow2 image based on
      AWS's official KVM cloud release with kernel 6.1. Faster-moving
      successor to Amazon Linux 2, drop-in for AL2023-targeted workloads
      on OpenStack and Proxmox.
    repo: open-img-cloud/amazon-linux-2023
    upstream_homepage: https://aws.amazon.com/linux/amazon-linux-2023/
    login_user: ec2-user
    featured: true
    latest_version: "2023.12.20261102.0"
    format: qcow2
    arch: x86_64
    tags: [openstack, proxmox, cloud-init, signed]
    logo: amazon.svg

  - os_name: alpaquita-linux
    title: Alpaquita Linux
    tagline: Lightweight Alpine-derived distribution from BellSoft, glibc and musl flavors.
    description: |
      Cloud-init-ready, signed Alpaquita Linux images, customized via
      `virt-customize` on top of the upstream BellSoft Stream qcow2.
      Produced in both glibc and musl variants for OpenStack and Proxmox.
    repo: open-img-cloud/alpaquita-linux
    upstream_homepage: https://bell-sw.com/alpaquita-linux/
    latest_version: "2026.11.09"
    format: qcow2
    arch: x86_64
    tags: [openstack, proxmox, cloud-init, signed]
    logo: alpaquita.svg
    login_user: alpaquita
    variants:
      - id: glibc
        label: glibc
        hint: GNU C library, widest binary compatibility
        filename_template: "alpaquita-{version}-glibc-x86_64.qcow2"
      - id: musl
        label: musl
        hint: musl libc, smallest footprint
        filename_template: "alpaquita-{version}-musl-x86_64.qcow2"

  - os_name: oracle-linux-9
    title: Oracle Linux 9
    tagline: Enterprise RHEL-compatible distribution from Oracle, RHEL 9 family.
    description: |
      Cloud-init-ready, signed Oracle Linux 9 qcow2 image based on
      Oracle's official KVM cloud release. Drop-in replacement for
      RHEL 9 / Rocky 9 / AlmaLinux 9 workloads on OpenStack and Proxmox.
    repo: open-img-cloud/oracle-linux-9
    upstream_homepage: https://www.oracle.com/linux/
    latest_version: "9.8-b293"
    login_user: cloud-user
    format: qcow2
    arch: x86_64
    tags: [openstack, proxmox, cloud-init, signed]
    logo: oracle.svg

  - os_name: oracle-linux-10
    title: Oracle Linux 10
    tagline: Latest Oracle Linux release, RHEL 10 family with UEK 8.
    description: |
      Cloud-init-ready, signed Oracle Linux 10 qcow2 image based on
      Oracle's official KVM cloud release. RHEL 10-compatible base
      with the Unbreakable Enterprise Kernel for OpenStack and Proxmox.
    repo: open-img-cloud/oracle-linux-10
    upstream_homepage: https://www.oracle.com/linux/
    latest_version: "10.1-b291"
    login_user: cloud-user
    featured: true
    format: qcow2
    arch: x86_64
    tags: [openstack, proxmox, cloud-init, signed]
    logo: oracle.svg

  - os_name: nixos
    title: NixOS
    tagline: Reproducible, declarative Linux distribution built from a Nix flake.
    description: |
      Cloud-init-ready, signed NixOS qcow2 image built from a pinned
      Nix flake. Reproducible by construction — same flake input
      always yields the same image. Drop-in for declarative-infra
      shops on OpenStack and Proxmox.
    repo: open-img-cloud/nixos
    upstream_homepage: https://nixos.org/
    latest_version: "25.11"
    login_user: nixos
    format: qcow2
    arch: x86_64
    tags: [openstack, proxmox, cloud-init, signed]
    logo: nixos.svg

  - os_name: octavia-amphora
    title: Octavia Amphora
    tagline: OpenStack load balancer amphora image, built via diskimage-builder.
    description: |
      Cloud-init-ready, signed Octavia Amphora qcow2 with HAProxy
      pre-installed, built from upstream `openstack/octavia` element
      packs via `diskimage-builder`. Drop-in for a reference Octavia
      deployment on OpenStack.
    repo: open-img-cloud/octavia-amphora
    upstream_homepage: https://docs.openstack.org/octavia/latest/
    latest_version: "2026.1"
    previous_versions:
      - "2025.2"
      - "2025.1"
    format: qcow2
    arch: x86_64
    tags: [openstack, octavia, dib, signed]
    logo: openstack.svg
