allowBuilds:
  esbuild: true
  sharp: true
  # workerd is injected transitively by Cloudflare Pages' deploy step
  # (it auto-installs wrangler). Allow its postinstall so CF deploy succeeds.
  workerd: true

overrides:
  yaml: ^2.8.3
  # Security: minimatch <11.0.1 (via eslint's @eslint/config-array, dev only).
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
