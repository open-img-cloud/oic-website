name: deploy

# Builds the static site and deploys it to Cloudflare Workers (Static Assets),
# bound to openimages.cloud and www.openimages.cloud (see wrangler.toml).
# Also runs daily so the catalog picks up newly published MANIFEST.json files.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 7 * * *" # daily 07:30 UTC, after the upstream watchers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          # Read-only use: the GitHub star count shown in the header (higher API rate limit).
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      # Documentation (open-img-cloud/docs, Zensical) served at /docs/.
      - name: Check out the documentation
        uses: actions/checkout@v5
        with:
          repository: open-img-cloud/docs
          path: _docs
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build documentation into dist/docs
        run: |
          python -m pip install --disable-pip-version-check zensical==0.1.1
          scripts/build-docs.sh _docs

      - name: List pages that changed (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs changed > "$RUNNER_TEMP/changed.txt"; wc -l < "$RUNNER_TEMP/changed.txt"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs submit "$RUNNER_TEMP/changed.txt"
